name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token, and no credentials left in the checkout, so a package's
# install code cannot push to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install --require-hashes -r requirements-audit.txt
          pip-audit --strict -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Check source punctuation is ASCII
        run: |
          if git grep -nP '[\x{2013}\x{2014}\x{2190}-\x{21FF}\x{2500}-\x{257F}]' -- 'src' 'tests' 'alembic' 'README.md'; then
            echo "Non-ASCII punctuation found in source; use plain ASCII equivalents."
            exit 1
          fi
